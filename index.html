<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail Énergie</title>

<style>
body{
    margin:0;
    height:100vh;
    background:radial-gradient(circle at center,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* PORTAIL */
#portal{
    width:160px;
    height:160px;
    border-radius:50%;
    background:linear-gradient(45deg,#00f5ff,#0066ff);
    box-shadow:0 0 60px #00f5ff;
    cursor:pointer;
    position:relative;
    animation:pulse 2s infinite;
    transition:transform 0.4s ease;
}

#portal:hover{
    transform:scale(1.15);
}

/* Animation pulsation */
@keyframes pulse{
    0%{box-shadow:0 0 30px #00f5ff;}
    50%{box-shadow:0 0 80px #00f5ff;}
    100%{box-shadow:0 0 30px #00f5ff;}
}

/* Onde énergie */
.energy{
    position:absolute;
    width:160px;
    height:160px;
    border-radius:50%;
    border:3px solid #00f5ff;
    animation:expand 1.5s ease-out forwards;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

@keyframes expand{
    from{
        transform:translate(-50%,-50%) scale(1);
        opacity:1;
    }
    to{
        transform:translate(-50%,-50%) scale(4);
        opacity:0;
    }
}

/* Message */
#message{
    position:absolute;
    bottom:80px;
    color:white;
    font-size:24px;
    letter-spacing:2px;
    opacity:0;
    transition:opacity 1s ease;
}

/* Particules */
.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:#00f5ff;
    border-radius:50%;
    animation:float 2s linear forwards;
}

@keyframes float{
    from{
        opacity:1;
        transform:translate(0,0);
    }
    to{
        opacity:0;
        transform:translate(var(--x),var(--y));
    }
}
</style>
</head>

<body>

<div id="portal"></div>
<div id="message">PORTAL ACTIVATED</div>

<script>
const portal = document.getElementById("portal");
const message = document.getElementById("message");

portal.addEventListener("click", () => {

    // Onde énergie
    const wave = document.createElement("div");
    wave.classList.add("energy");
    document.body.appendChild(wave);

    setTimeout(()=>{
        wave.remove();
    },1500);

    // Message
    message.style.opacity = "1";

    // Particules
    for(let i=0;i<20;i++){
        const particle = document.createElement("div");
        particle.classList.add("particle");

        const x = (Math.random() - 0.5) * 600 + "px";
        const y = (Math.random() - 0.5) * 600 + "px";

        particle.style.setProperty("--x", x);
        particle.style.setProperty("--y", y);

        particle.style.top = "50%";
        particle.style.left = "50%";

        document.body.appendChild(particle);

        setTimeout(()=>{
            particle.remove();
        },2000);
    }

});
</script>

</body>
</html>
